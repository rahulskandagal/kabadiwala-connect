<!doctype html>
<html lang="hi-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#166534">
  <title>Kabadiwala Connect · कबाड़ीवाला कनेक्ट</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <span class="logo">♻️</span>
      <div class="title"></div>
      <select id="lang" aria-label="Language"><option value="hi">हिंदी</option><option value="mr">मराठी</option><option value="en">English</option></select>
    </div>
    <div class="status">
      <span id="net" class="pill"><span class="dot"></span></span>
      <span id="pend" class="pill warn" style="display:none"></span>
      <button id="install" class="pill" style="display:none;border:0;color:#fff;cursor:pointer">⬇ Install</button>
      <a class="pill" href="recycler.html" style="margin-left:auto;color:#fff;text-decoration:none">🏭 Console</a>
    </div>
  </header>
  <main></main>
  <button class="fab" id="mic" title="Ask by voice">🎤</button>
  <nav class="tabs">
    <button data-tab="snap"><span class="ic">📷</span><span></span></button>
    <button data-tab="board"><span class="ic">📋</span><span></span></button>
    <button data-tab="recyclers"><span class="ic">♻️</span><span></span></button>
    <button data-tab="ledger"><span class="ic">💰</span><span></span></button>
    <button data-tab="safety"><span class="ic">🛡️</span><span></span></button>
  </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.22.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/db.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
